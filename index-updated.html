<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F8">
<title>MDS Motion</title>
<style>
:root{--navy:#102B59;--blue:#2463C7;--bg:#E6EBF2;--card:#FFFFFF;--text:#0B1220;--muted:#6B7280;--sep:#E4E8EF;--soft:#EDF3FC;--ok:#16A34A;--warn:#B54708;--danger:#D92D20;--r:16px;--r-s:12px;--shadow:6px 6px 14px rgba(163,177,198,.45),-6px -6px 14px rgba(255,255,255,.9)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{min-height:100vh}
/* ---- Mobile header ---- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 16px;background:rgba(255,255,255,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--sep)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--navy);letter-spacing:-.01em}
.mark{width:32px;height:32px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);color:var(--navy);display:grid;place-items:center;cursor:pointer;transition:transform .12s,background .15s}
.iconbtn:active{transform:scale(.94)}
.iconbtn:disabled{opacity:.4}
/* ---- Sidebar (desktop) ---- */
.side{display:none}
.main{padding:20px 16px 110px;max-width:960px;margin:0 auto}
.page-head{margin:6px 0 18px}
.page-head h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--navy)}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:15px}
/* ---- Components ---- */
.card{background:var(--card);border:1px solid var(--sep);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:18px;font-weight:650;color:var(--navy)}
.group{background:var(--card);border:1px solid var(--sep);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--sep);min-height:58px;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer;transition:background .15s}
.item:last-child{border-bottom:0}
.item:hover{background:#F8FAFD}
.item:active{background:var(--soft)}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .s{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin-bottom:14px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--sep);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:28px;color:var(--navy);letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:13px;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--r-s);border:0;background:var(--blue);color:#fff;font-weight:600;font-size:16px;cursor:pointer;transition:transform .1s,opacity .15s,background .15s;text-decoration:none}
.btn:hover{background:#1E56B3}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.navy{background:var(--navy)}
.btn.ghost{background:rgba(255,255,255,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.75);color:var(--navy)}
.btn.wa{background:#25D366;color:#fff}
.btn.danger{background:var(--danger)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-flex;align-items:center;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--navy);white-space:nowrap}
.pill.ok{background:#E8F7EE;color:var(--ok)}
.pill.warn{background:#FEF3E2;color:var(--warn)}
.pill.bad{background:#FDECEC;color:var(--danger)}
.src{display:inline-block;font-size:12px;padding:3px 9px;border-radius:8px;background:#EEF1F6;color:#44506A}
.field{display:block;margin-bottom:16px}
.field>span{display:block;font-size:14px;font-weight:600;color:var(--navy);margin-bottom:6px}
.input,.select,.area{width:100%;min-height:50px;padding:12px 14px;border:1px solid var(--sep);border-radius:var(--r-s);background:rgba(255,255,255,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 2px 2px 5px rgba(163,177,198,.35),inset -2px -2px 5px rgba(255,255,255,.8);font-size:16px;transition:border-color .15s,box-shadow .15s}
.area{min-height:96px;resize:vertical}
.input:focus,.select:focus,.area:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(36,99,199,.18)}
.input[aria-invalid="true"]{border-color:var(--danger)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.err{font-size:13px;color:var(--danger);margin-top:6px;font-weight:500}
.grid2{display:grid;gap:0 14px;grid-template-columns:1fr}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--sep);background:rgba(255,255,255,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:600;font-size:14px;cursor:pointer;color:var(--navy)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.msg{background:var(--soft);border-radius:var(--r-s);padding:14px;white-space:pre-wrap;font-size:15px;margin-bottom:12px}
.bubble{padding:11px 14px;border-radius:18px;max-width:82%;margin-bottom:8px;white-space:pre-wrap;font-size:15px}
.bubble.in{background:#EEF0F4}
.bubble.out{background:var(--blue);color:#fff;margin-left:auto}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.dropzone{border:1.5px dashed #B7C4D9;border-radius:var(--r);padding:22px;text-align:center;background:#FAFBFD;cursor:pointer;transition:background .15s,border-color .15s;margin-bottom:12px}
.dropzone:hover{background:var(--soft);border-color:var(--blue)}
.dropzone .up{width:44px;height:44px;margin:0 auto 8px;border-radius:50%;background:var(--soft);color:var(--blue);display:grid;place-items:center}
.dropzone b{display:block;color:var(--navy)}
.dropzone small{color:var(--muted)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:6px}
.file{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:10px;border:1px solid rgba(255,255,255,.8);border-radius:var(--r);background:rgba(255,255,255,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow);min-width:0}
.file .thumb{width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bg);display:grid;place-items:center}
.file .thumb img,.file .thumb video{width:100%;height:100%;object-fit:cover}
.file .meta{width:100%;min-width:0}
.file .chip-x{position:absolute;top:6px;right:6px;width:32px;height:32px}
.file .meta b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .meta small{color:var(--muted);font-size:12px}
.file audio{width:100%;margin-top:6px}
.chip-x{width:36px;height:36px;border-radius:50%;border:0;background:#FDECEC;color:var(--danger);display:grid;place-items:center;cursor:pointer;flex:none}
/* ---- Modal / sheet / drawer ---- */
.overlay{position:fixed;inset:0;background:rgba(11,18,32,.38);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.overlay.center{align-items:center;padding:16px}
.sheet{background:rgba(255,255,255,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.8);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.overlay.center .sheet{border-radius:22px}
.sheet h2{margin:0 0 6px;font-size:20px;color:var(--navy)}
.sheet p{margin:0 0 18px;color:var(--muted)}
.sheet .stack{display:flex;flex-direction:column;gap:10px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer-ov{position:fixed;inset:0;background:rgba(11,18,32,.38);z-index:50;animation:fade .2s ease-out}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(330px,86vw);background:rgba(255,255,255,.7);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);z-index:51;box-shadow:-10px 0 30px rgba(0,0,0,.12);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 14px;border-bottom:1px solid var(--sep)}
.drawer-head b{font-size:17px;color:var(--navy)}
.drawer-body{padding:10px;overflow-y:auto;flex:1}
.nav-item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;min-height:54px;width:100%;background:none;border:0;cursor:pointer;color:var(--text);font-weight:600;font-size:16px;text-align:left;margin-bottom:4px}
.nav-item .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--navy);flex:none}
.nav-item.on{background:var(--soft);color:var(--navy)}
.nav-item:hover{background:#F5F7FB}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--text);color:#fff;padding:12px 18px;border-radius:14px;font-weight:500;transition:.25s;pointer-events:none;z-index:70;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{display:inline-block;width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---- Desktop layout ---- */
@media(min-width:900px){
  .topbar{display:none}
  .app{display:grid;grid-template-columns:240px 1fr}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--sep);padding:22px 14px}
  .side .brand{padding:0 8px 18px}
  .side .nav-item{padding:11px 12px;min-height:46px;font-size:15px}
  .side .nav-item .ico{width:32px;height:32px}
  .main{padding:28px 32px 60px}
  .drawer,.drawer-ov{display:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div>
    <header class="topbar">
      <div class="brand"><span class="mark">MDS</span>MDS Motion</div>
      <button class="iconbtn" id="acctBtn" aria-label="Account menu" onclick="openDrawer()">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </button>
    </header>
    <main class="main" id="app"></main>
  </div>
</div>
<div id="layer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// =====================================================================
// DATA LAYER — mock, in-memory only. Replace with Firebase/Supabase later.

      analysis:{ bio:"Home baker · Eggless desserts · Delivers in Delhi", style:"Overhead shots, ASMR audio", quality:"Clean framing, slow pacing", improvements:"Shorter recipe reels; on-screen steps", consistency:"Irregular posting", requirements:"Reel cuts, captions in Hindi & English", opportunities:"Local food delivery partnerships", services:"Starter package, Shorts editing", score:58, potential:"Medium Potential", source:"Verified (provided by you)" } },

  followups:[

    { id:"f2", leadId:"lead_002", due:"2026-10-29", status:"open", message:"Ask if she wants the starter package.", last:"2026-10-25" },

  ],
  activity:["Aarav Mehta marked Interested","Priya Sharma contacted via WhatsApp","Rohan Kapoor lead added"]

// Temporary UI state (not saved anywhere)
const UI = { drawer:false, leadTab:"profile", msgLang:"EN", leadQuery:"", leadStatus:"", pendingFiles:{ shot:[], photo:[], vids:[] }, recording:false, voiceUrl:null, lastAnalysis:{}, addErrors:{} };
let flashMsg = null;

// ---------- helpers ----------
const uid = p => p+"_"+Math.random().toString(36).slice(2,9);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const getLead = id => DB.leads.find(l=>l.id===id);
const waLink = (cc,p,text) => `https://wa.me/${String(cc+p).replace(/\D/g,"")}?text=${encodeURIComponent(text)}`;
const fmtSize = b => b>=1048576 ? (b/1048576).toFixed(2)+" MB" : Math.max(1,Math.round(b/1024))+" KB";
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove("show"),2200); }
function notify(msg){ flashMsg=msg; render(); }

// ---------- icons (Lucide-style, stroke based) ----------
const P = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20c0-2.6-1.6-4.6-4-5.5"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  board:'<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/>',
  tag:'<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 12V3h9l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
  upload:'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  back:'<path d="M15 6l-6 6 6 6"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  file:'<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/>',
  film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>'
};
const ico = (n,cls="i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

// ---------- navigation ----------
const NAV = [
  {h:"#/dashboard",t:"Dashboard",i:"home"},
  {h:"#/add",t:"Add New Lead",i:"plus"},
  {h:"#/leads",t:"All Leads",i:"users"},
  {h:"#/followups",t:"Follow-ups",i:"calendar"},
  {h:"#/pipeline",t:"CRM Pipeline",i:"board"},
  {h:"#/portfolio",t:"Portfolio & Pricing",i:"tag"},

let recorder=null, recStream=null, recChunks=[];
async function toggleRecord(){
  if(UI.recording){ recorder.stop(); return; }
  if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){ toast("Recording is not supported in this browser. Use Upload audio instead."); return; }
  try{
    recStream=await navigator.mediaDevices.getUserMedia({audio:true});
    recChunks=[]; recorder=new MediaRecorder(recStream);
    recorder.ondataavailable=e=>recChunks.push(e.data);
    recorder.onstop=()=>{
      recStream.getTracks().forEach(t=>t.stop()); recStream=null; UI.recording=false;
      if(UI.voiceUrl) URL.revokeObjectURL(UI.voiceUrl);
      UI.voiceUrl=URL.createObjectURL(new Blob(recChunks,{type:recorder.mimeType||"audio/webm"}));
      render();
    };
    recorder.start(); UI.recording=true; render();
  }catch(err){ toast("Microphone access was denied or is unavailable."); }
}
function uploadAudio(input){
  const f=input.files[0]; if(!f) return;
  if(UI.voiceUrl) URL.revokeObjectURL(UI.voiceUrl);
  UI.voiceUrl=URL.createObjectURL(f); render();
}
function pageMedia(l){
  const pend = [...UI.pendingFiles.vids];
  return `<h2>Uploaded media for this lead</h2>
  ${l.media.length?`<div class="files">${l.media.map((m,i)=>`<div class="file"><div class="thumb">${m.type.startsWith('video')?`<video src="${m.url}" muted></video>`:`<img src="${m.url}" alt="">`}</div><div class="meta"><b>${esc(m.name)}</b><small>${esc(m.kind)} · ${fmtSize(m.size)}</small></div><button class="chip-x" aria-label="Remove file" onclick="removeLeadMedia('${l.id}',${i})">${ico("trash")}</button></div>`).join("")}</div>`:'<div class="empty">No media saved for this lead</div>'}
  <p class="hint">Files are previews in this browser session only. They are not stored permanently yet.</p>`;
}
function removeLeadMedia(id,i){
  confirmDialog("Remove this file?","The file will be removed from this lead's view.","Remove",()=>{ const l=getLead(id); l.media.splice(i,1); notify("File removed"); });
}
function pageLeadFollowups(l){
  const items=DB.followups.filter(f=>f.leadId===l.id);
  return `<h2>Follow-up history</h2>${items.map(f=>`<div class="item" style="padding:12px 0;border-bottom:1px solid var(--sep)"><span class="grow"><div class="t">${esc(f.message)}</div><div class="s">Next ${f.due} · Last ${f.last}</div></span><span class="pill ${f.status==='done'?'ok':''}">${f.status==='done'?'Completed':'Open'}</span></div>`).join("")||'<div class="empty">No follow-ups for this lead</div>'}
  <a class="btn ghost block" style="margin-top:12px" href="#/followups">Manage follow-ups</a>`;
}
function pageNotes(l){
  return `<h2>Personal notes</h2><textarea class="area" style="min-height:160px" id="notes">${esc(l.notes)}</textarea>
  <div class="btn-row"><button class="btn sm" onclick="getLead('${l.id}').notes=document.getElementById('notes').value;notify('Note saved')">${ico("check")} Save note</button></div>`;
}
function pageStatus(l){
  const idx=STATUSES.indexOf(l.status);
  return `<h2>Client status</h2>
  <label class="field"><span>Current status</span><select class="select" onchange="setStatus('${l.id}',this.value)">${STATUSES.map(s=>`<option ${s===l.status?'selected':''}>${s}</option>`).join("")}</select></label>
  <h2>Closing progress</h2>
  <div style="background:var(--bg);border-radius:99px;height:10px;overflow:hidden"><div style="height:100%;width:${Math.round((idx+1)/STATUSES.length*100)}%;background:var(--blue);border-radius:99px"></div></div>
  <div class="hint">Stage ${idx+1} of ${STATUSES.length}</div>`;
}
function setStatus(id,s){ const l=getLead(id); l.status=s; DB.activity.unshift(l.name+" moved to "+s); notify("Status updated to "+s); }

// ---------- FOLLOW-UPS ----------
function pageFollowups(){
  const open=DB.followups.filter(f=>f.status==="open");
  const groups={ "Overdue":open.filter(f=>f.due<TODAY), "Today":open.filter(f=>f.due===TODAY), "Upcoming":open.filter(f=>f.due>TODAY), "Completed":DB.followups.filter(f=>f.status==="done") };
  const row=f=>{ const l=getLead(f.leadId); return `<div class="item" style="padding:14px 0;border-bottom:1px solid var(--sep);flex-wrap:wrap"><span class="grow" style="min-width:180px"><div class="t">${esc(l?.name)}</div><div class="s" style="white-space:normal">${esc(f.message)}</div><div class="hint" style="margin-top:2px">Last ${f.last} · Due ${f.due}</div></span>
    <span class="btn-row" style="margin:0">${f.status==='done'?'<span class="pill ok">Completed</span>':`<button class="btn ghost sm" onclick="doneFU('${f.id}')">${ico("check")} Done</button><button class="btn ghost sm" onclick="reschedFU('${f.id}')">${ico("calendar")} Reschedule</button>`}<a class="btn ghost sm" href="#/lead/${f.leadId}">Open</a></span></div>`; };
  return `
  <div class="page-head"><h1>Follow-ups</h1><p>Schedule and track your next contact.</p></div>
  <div class="card"><h2>Schedule a follow-up</h2>
    <div class="grid2">
      <label class="field"><span>Client</span><select class="select" id="fuLead">${DB.leads.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join("")}</select></label>
      <label class="field"><span>Follow-up date</span><input class="input" type="date" id="fuDate" value="${TODAY}"></label>
    </div>
    <label class="field"><span>Follow-up message</span><input class="input" id="fuMsg" placeholder="What should you say?"></label>
    <button class="btn" onclick="addFU()">${ico("plus")} Schedule</button></div>
  ${Object.entries(groups).map(([k,v])=>`<div class="card"><h2>${k} (${v.length})</h2>${v.map(row).join("")||'<div class="empty" style="padding:12px">Nothing here</div>'}</div>`).join("")}`;
}
function addFU(){
  const leadId=document.getElementById("fuLead").value, due=document.getElementById("fuDate").value, message=document.getElementById("fuMsg").value.trim();
  if(!due||!message){ toast("Please enter a date and message."); return; }
  DB.followups.push({id:uid("f"),leadId,due,status:"open",message,last:TODAY}); notify("Follow-up scheduled");
}
function doneFU(id){ DB.followups.find(f=>f.id===id).status="done"; notify("Marked as completed"); }
function reschedFU(id){
  const layer=document.getElementById("layer");
  layer.insertAdjacentHTML("beforeend",`<div class="overlay center" id="rs"><div class="sheet"><h2>Reschedule follow-up</h2><p>Pick a new date.</p>
    <input class="input" type="date" id="rsDate" value="${TODAY}"><div class="stack" style="margin-top:14px"><button class="btn block" id="rsOk">Save date</button><button class="btn ghost block" id="rsNo">Cancel</button></div></div></div>`);
  document.getElementById("rsNo").onclick=()=>document.getElementById("rs").remove();
  document.getElementById("rsOk").onclick=()=>{ const d=document.getElementById("rsDate").value; if(!d){toast("Pick a date");return;} DB.followups.find(f=>f.id===id).due=d; document.getElementById("rs").remove(); notify("Rescheduled to "+d); };
}

// ---------- PIPELINE ----------
function pagePipeline(){
  return `<div class="page-head"><h1>CRM Pipeline</h1><p>Change a client's stage. Changes apply across the app.</p></div>
  <div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">${STATUSES.map(s=>{
    const ls=DB.leads.filter(l=>l.status===s);
    return `<div class="card" style="margin:0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b style="color:var(--navy)">${s}</b><span class="pill">${ls.length}</span></div>
      ${ls.map(l=>`<div style="padding:10px 0;border-top:1px solid var(--sep)"><a href="#/lead/${l.id}" style="font-weight:600;color:var(--navy)">${esc(l.name)}</a>
      <select class="select" style="min-height:42px;margin-top:6px" aria-label="Status for ${esc(l.name)}" onchange="setStatus('${l.id}',this.value)">${STATUSES.map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join("")}</select></div>`).join("")||'<div class="hint">No clients</div>'}</div>`;}).join("")}</div>`;
}

// ---------- PORTFOLIO & PRICING ----------
function pagePortfolio(){
  const s=DB.settings;
  return `<div class="page-head"><h1>Portfolio & Pricing</h1><p>Used later when AI writes your messages. Saved in this session only.</p></div>
  <form class="card" onsubmit="savePortfolio(event)">
    <div class="grid2">
      <label class="field"><span>Portfolio URL</span><input class="input" name="portfolio" value="${esc(s.portfolio)}"></label>
      <label class="field"><span>Preferred niches</span><input class="input" name="niches" value="${esc(s.niches)}"></label>
      <label class="field"><span>Video editing services</span><input class="input" name="services" value="${esc(s.services)}"></label>
      <label class="field"><span>Starting price</span><input class="input" name="startPrice" value="${esc(s.startPrice)}"></label>
      <label class="field"><span>Monthly packages</span><input class="input" name="monthly" value="${esc(s.monthly)}"></label>
      <label class="field"><span>Delivery time</span><input class="input" name="delivery" value="${esc(s.delivery)}"></label>
    </div>
    <label class="field"><span>Revision policy</span><input class="input" name="revisions" value="${esc(s.revisions)}"></label>
    <label class="field"><span>Personal introduction</span><textarea class="area" name="intro">${esc(s.intro)}</textarea></label>
    <div class="btn-row"><button class="btn" type="submit">${ico("check")} Save</button></div>
  </form>`;
}
function savePortfolio(ev){ ev.preventDefault(); const f=Object.fromEntries(new FormData(ev.target)); Object.assign(DB.settings,f); notify("Portfolio & pricing saved"); }

// ---------- APP SETTINGS ----------
function pageSettings(){
  const s=DB.settings;
  return `<div class="page-head"><h1>App Settings</h1><p>Your profile and default preferences.</p></div>
  <div class="card">
    <label class="field"><span>Display name</span><input class="input" id="pName" value="${esc(DB.profile.name)}"></label>
    <div class="field"><span>Default message language</span>
      <div class="seg" style="margin:0"><button class="${s.defaultLang==='EN'?'on':''}" onclick="setLang('EN')">English</button><button class="${s.defaultLang==='HI'?'on':''}" onclick="setLang('HI')">हिंदी</button></div></div>
    <div class="btn-row"><button class="btn sm" onclick="saveProfile()">${ico("check")} Save</button></div>
  </div>
  <div class="group">
    <button class="item" onclick="confirmDialog('Reset demo leads?','Restores the sample leads, follow-ups and conversations shown in the demo. Your new leads will be removed.','Reset demo',resetDemo)"><span class="grow"><div class="t" style="color:var(--danger)">Reset demo data</div><div class="s">Restores sample data for this session</div></span>${ico("chev")}</button>
  </div>
  <p class="hint">This is a frontend demo. Data is kept in memory and resets on page refresh.</p>`;
}
function setLang(l){ DB.settings.defaultLang=l; UI.msgLang=l; render(); }
function saveProfile(){ DB.profile.name=document.getElementById("pName").value.trim()||DB.profile.name; notify("Settings saved"); }
function resetDemo(){ location.reload(); }

// ---------- ROUTER ----------
function render(){
  const parts=location.hash.replace(/^#\/?/,"").split("/");
  const page=parts[0]||"dashboard", id=parts[1];
  const views={dashboard:pageDashboard,add:pageAdd,leads:pageLeads,followups:pageFollowups,pipeline:pagePipeline,portfolio:pagePortfolio,settings:pageSettings};
  let html = page==="lead" ? pageLead(id) : (views[page]?views[page]():`<div class="empty">Page not found</div>`);
  const notice = flashMsg ? `<div class="card" style="background:#E8F7EE;color:var(--ok);font-weight:600;padding:14px">${esc(flashMsg)}</div>` : "";
  flashMsg=null;
  const keepQ=document.activeElement?.id; 
  document.getElementById("app").innerHTML = notice+html;
  renderSide(); renderDrawer();
  if(keepQ==="q"){ const q=document.getElementById("q"); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }
}
window.addEventListener("hashchange",()=>{
  if(recorder?.state==="recording"){ recorder.onstop=()=>{ recStream?.getTracks().forEach(t=>t.stop()); recStream=null; UI.recording=false; }; recorder.stop(); }
  UI.voiceUrl=null; UI.leadTab="profile"; closeDrawer(); render(); window.scrollTo(0,0);
});
window.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(UI.drawer) closeDrawer(); } });
if(!location.hash) location.hash="#/dashboard";
render();
</script>
</body>
</html>
